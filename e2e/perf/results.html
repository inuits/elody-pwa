<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detail page performance</title>
    <style>
      :root {
        --bg: #f7f7f8;
        --surface: #ffffff;
        --text: #1d1d22;
        --muted: #6b6b76;
        --border: #e3e3e8;
        --better: #1a7f4b;
        --worse: #b42318;
        --bar: #c9d8f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141417;
          --surface: #1d1d22;
          --text: #ececf1;
          --muted: #9a9aa6;
          --border: #2e2e36;
          --better: #4ade80;
          --worse: #f87171;
          --bar: #2c3f66;
        }
      }
      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 15px;
        margin: 32px 0 8px;
      }
      p.hint {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
      }
      label {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--muted);
      }
      select {
        font: inherit;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
      }
      .table-wrap {
        overflow-x: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        padding: 8px 12px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 600;
      }
      tr:last-child td {
        border-bottom: none;
      }
      th.num,
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        position: relative;
      }
      td.num .bar {
        position: absolute;
        inset: 6px auto 6px 0;
        background: var(--bar);
        border-radius: 3px;
        z-index: 0;
      }
      td.num span {
        position: relative;
      }
      .delta {
        font-size: 12px;
        margin-left: 6px;
      }
      .better {
        color: var(--better);
      }
      .worse {
        color: var(--worse);
      }
      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Detail page performance</h1>
      <p class="hint">
        Medians per measurement, generated by <code>pnpm perf</code> in
        <code>e2e/</code>. Differences are against the first measurement of the
        same client.
      </p>
      <div class="controls">
        <label
          >Client
          <select id="client"></select
        ></label>
        <label
          >Network
          <select id="profile"></select
        ></label>
        <label>
          Flow
          <select id="flow">
            <option value="listToDetail">List → detail</option>
            <option value="reload">Full reload of detail</option>
            <option value="session">Session: list → 2 details → back</option>
          </select>
        </label>
      </div>
      <div class="table-wrap"><table id="results"></table></div>
      <h2>GraphQL operations, list → detail (local)</h2>
      <p class="hint" id="operations-hint"></p>
      <div class="table-wrap"><table id="operations"></table></div>
    </main>
    <script src="results.js"></script>
    <script>
      const results = window.PERF_RESULTS ?? [];
      const metrics = [
        ["requests", "Requests", ""],
        ["entityMs", "Entity loaded", " ms"],
        ["doneMs", "All requests done", " ms"],
        ["kb", "Transferred", " KB"],
        ["persistedQueryMisses", "PQ retries", ""],
      ];
      const $ = (id) => document.getElementById(id);
      const escape = (value) =>
        String(value).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
      const formatDate = (iso) => {
        const d = new Date(iso);
        const pad = (n) => String(n).padStart(2, "0");
        return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };
      const fill = (select, values) => {
        select.innerHTML = values
          .map((v) => `<option>${escape(v)}</option>`)
          .join("");
      };

      fill($("client"), [...new Set(results.map((r) => r.client))]);
      fill($("profile"), [
        ...new Set(results.flatMap((r) => Object.keys(r.profiles))),
      ]);

      const delta = (value, base) => {
        if (!base || value === base) return "";
        const pct = Math.round(((value - base) / base) * 100);
        const cls = value < base ? "better" : "worse";
        return `<span class="delta ${cls}">${pct > 0 ? "+" : ""}${pct}%</span>`;
      };

      const render = () => {
        const rows = results.filter((r) => r.client === $("client").value);
        const profile = $("profile").value;
        const flow = $("flow").value;
        const values = rows.map((r) => r.profiles[profile]?.[flow]);
        const base = values[0];
        const max = Object.fromEntries(
          metrics.map(([key]) => [
            key,
            Math.max(1, ...values.map((v) => v?.[key] ?? 0)),
          ]),
        );

        $("results").innerHTML = `
          <tr><th>Step</th><th>Date</th><th>Commit</th>${metrics
            .map(([, title]) => `<th class="num">${title}</th>`)
            .join("")}</tr>
          ${rows
            .map((r, i) => {
              const v = values[i];
              return `<tr><td>${escape(r.label)}</td><td class="muted">${formatDate(r.date)}</td><td class="muted">${escape(r.commit)}</td>${metrics
                .map(([key, , unit]) =>
                  v
                    ? `<td class="num"><div class="bar" style="width:${(v[key] / max[key]) * 100}%"></div><span>${v[key]}${unit}${i ? delta(v[key], base?.[key]) : ""}</span></td>`
                    : `<td class="num muted">–</td>`,
                )
                .join("")}</tr>`;
            })
            .join("")}`;

        const first = rows[0];
        const last = rows[rows.length - 1];
        if (!first) {
          $("operations-hint").textContent = "No measurements yet.";
          $("operations").innerHTML = "";
          return;
        }
        $("operations-hint").textContent =
          first === last
            ? `${first.label}, ${first.detailPath}`
            : `${first.label} → ${last.label}, ${last.detailPath}`;
        const names = [
          ...new Set([
            ...Object.keys(first.operations),
            ...Object.keys(last.operations),
          ]),
        ].sort(
          (a, b) =>
            (first.operations[b] ?? 0) - (first.operations[a] ?? 0) ||
            a.localeCompare(b),
        );
        $("operations").innerHTML = `
          <tr><th>Operation</th><th class="num">${escape(first.label)}</th>${
            first === last ? "" : `<th class="num">${escape(last.label)}</th>`
          }</tr>
          ${names
            .map(
              (name) =>
                `<tr><td>${escape(name)}</td><td class="num">${first.operations[name] ?? 0}</td>${
                  first === last
                    ? ""
                    : `<td class="num">${last.operations[name] ?? 0}${delta(last.operations[name] ?? 0, first.operations[name] ?? 0)}</td>`
                }</tr>`,
            )
            .join("")}`;
      };

      ["client", "profile", "flow"].forEach((id) =>
        $(id).addEventListener("change", render),
      );
      render();
    </script>
  </body>
</html>
